<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="6" dy="8" stdDeviation="0" flood-color="#182B49" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="96" fill="#FFF4E4" />
  
  <!-- Outer Border Frame -->
  <rect x="16" y="16" width="480" height="480" rx="80" fill="none" stroke="#182B49" stroke-width="12" />

  <!-- Diagonal Graphic Torn Paper Cutout (Cobalt Blue) -->
  <polygon points="64,80 448,64 430,360 80,430" fill="#2455D6" filter="url(#shadow)" />

  <!-- Orange Washi Tape Accent -->
  <polygon points="120,40 280,48 276,84 116,76" fill="#F26B38" />

  <!-- Sunflower Yellow Highlight Piece -->
  <rect x="290" y="320" width="130" height="80" fill="#F5C542" transform="rotate(-6 355 360)" filter="url(#shadow)" />

  <!-- Center Arabic Calligraphic Monogram "حِتّة" -->
  <g fill="#FFFFFF" transform="translate(256, 260) scale(1.1)">
    <!-- Stylized Ha / Hitta shape -->
    <text x="0" y="30" font-family="'Cairo', sans-serif" font-size="160" font-weight="900" text-anchor="middle" fill="#FFFFFF" stroke="#182B49" stroke-width="16" stroke-linejoin="round" paint-order="stroke fill">
      حِتّة
    </text>
  </g>

  <!-- Red Vintage Egyptian Postmark Stamp in corner -->
  <g transform="translate(380, 130) rotate(15)">
    <circle cx="0" cy="0" r="42" fill="#E8473F" stroke="#182B49" stroke-width="4" stroke-dasharray="6,4" />
    <text x="0" y="6" font-family="'Cairo', sans-serif" font-size="14" font-weight="900" text-anchor="middle" fill="#FFFFFF">
      مِصر
    </text>
  </g>
</svg>
